<style>
:root{
  --desk:#E4E5E8; --paper:#FAFAFA; --line:#D9DCE1; --margin:#F0A6B0;
  --ink:#2E3037; --pencil:#6B6E76; --grey:#9C9EA5;
  --border:#E3E4E8; --border2:#D9DADF; --tint:#F4F4F6;
  --red:#E2463B; --green:#2FA36B; --hl:#FFF0A0;
  --blue:#3E6FD9; --blue-soft:#E8EEFC; --blue-deep:#2B52AE;
  --orange:#F08A2C; --orange-soft:#FFF1E1;
  --zhfont:'Huninn','Zen Maru Gothic','PingFang TC','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(16px, 0.6vw + 13.3px, 23px)}
body{margin:0;background:var(--desk);font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);line-height:1.5}
.zh{display:none;font-family:var(--zhfont);color:var(--pencil);font-size:.86em;line-height:1.5}
body.zh-on .zh{display:block}
body.zh-on .zhi{display:inline}
.zhi{display:none;font-family:var(--zhfont);color:var(--pencil)}
.hand{font-family:'Caveat',cursive}

/* notebook page */
.notebook{position:relative;width:100%;margin:0 auto;background:var(--paper);min-height:100vh;
  box-shadow:0 .4rem 1.6rem rgba(0,0,0,.14);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 1.875rem;background-position:0 .9rem;}
@media(min-width:1200px){.notebook{max-width:80vw;margin:1.5rem auto;border-radius:.4rem}}
.notebook::before{content:"";position:absolute;top:0;bottom:0;left:2.875rem;width:2px;background:var(--margin)}
.notebook::after{content:"";position:absolute;top:0;bottom:0;left:0;width:1.6rem;
  background:radial-gradient(circle at .8rem 50%,#D2D3D8 .32rem,transparent .36rem);
  background-size:1.6rem 3.75rem;background-position:0 1.4rem}
.content{padding:1.6rem 1.25rem 3rem 3.9rem}

/* header */
.date{color:var(--pencil);font-size:1.25rem}
.topline{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.zhtoggle{display:inline-flex;align-items:center;gap:.45rem;border:0;background:transparent;font:inherit;cursor:pointer;padding:.25rem .35rem;border-radius:1rem}
.zhtoggle .lbl{font-family:var(--zhfont);font-size:.95rem;color:var(--pencil)}
.sw{width:2.6rem;height:1.45rem;border-radius:1rem;background:#D9DADF;position:relative;transition:background-color .25s;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:.15rem;left:.15rem;width:1.15rem;height:1.15rem;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s}
.zhtoggle[aria-pressed="true"] .sw{background:var(--blue)}
.zhtoggle[aria-pressed="true"] .sw::after{transform:translateX(1.15rem)}
h1{font-size:2rem;font-weight:700;margin:.15rem 0 .2rem;line-height:1.2}
h1 mark{background:linear-gradient(transparent 45%,var(--hl) 45%);padding:0 .1em}
h1 .zh{font-size:.9rem;font-weight:400}
.intro{margin:.4rem 0 1.2rem;color:var(--ink);max-width:40rem}

/* stats */
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 1.2rem;max-width:40rem}
.stat{flex:1 1 7rem;background:#fff;border:1px solid var(--border);border-radius:.7rem;padding:.55rem .8rem;text-align:center}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--grey)}

/* subject filter */
.filters{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.94);backdrop-filter:blur(4px);
  margin:0 -1.25rem 1.2rem -3.9rem;padding:.6rem 1.25rem .6rem 3.9rem;border-bottom:1px solid var(--border);
  display:flex;gap:.45rem;flex-wrap:wrap}
.chip{border:2px solid var(--border2);background:#fff;color:var(--ink);border-radius:999px;padding:.3rem .9rem;
  font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;transition:.15s}
.chip .zh{margin-left:.3rem;font-size:.85em}
body.zh-on .chip .zh{display:inline}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .zh{color:#ddd}

/* subject section */
.subject{margin:0 0 1.8rem}
.subject-head{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .8rem}
.subject-head h2{margin:0;font-size:1.3rem;font-weight:700}
.subject-head .count{color:var(--grey);font-size:.85rem}
.subject-head .bar{flex:1;height:2px;background:var(--border)}
.subject[data-subject="math"] .subject-head h2{color:var(--blue-deep)}
.subject[data-subject="isee"] .subject-head h2{color:#7A4FB7}
.subject[data-subject="english"] .subject-head h2{color:#C4680F}
.subject[data-subject="science"] .subject-head h2{color:#1F8A5B}
.subject[data-subject="social"] .subject-head h2{color:#6B4EA8}
.subject[data-subject="chinese"] .subject-head h2{color:#B23A48}

/* grid */
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}
@media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}}

/* card = a polaroid stuck on the page */
.card{position:relative;display:block;text-decoration:none;color:inherit;background:#fff;
  border:1px solid var(--border);border-radius:.6rem;padding:.7rem .7rem .8rem;
  box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .18s,box-shadow .18s;
  transform:rotate(var(--tilt,0deg))}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-.15rem);box-shadow:0 .5rem 1.1rem rgba(0,0,0,.14);outline:none}
.card:focus-visible{box-shadow:0 0 0 3px var(--blue),0 .5rem 1.1rem rgba(0,0,0,.14)}
.card::before{content:"";position:absolute;top:-.55rem;left:50%;width:4.5rem;height:1.1rem;margin-left:-2.25rem;
  background:rgba(255,236,150,.85);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:2}
.thumb{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:.35rem;background:#fff;border:1px solid var(--border)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .badge{position:absolute;right:.4rem;top:.4rem;background:var(--red);color:#fff;font-size:.68rem;font-weight:600;
  padding:.1rem .5rem;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card h3{margin:.65rem 0 .1rem;font-size:1.05rem;font-weight:600;line-height:1.25}
.card h3 .zh{font-weight:400;font-size:.82rem;margin-top:.1rem}
.card p{margin:.3rem 0 0;font-size:.85rem;color:var(--ink);line-height:1.4}
.card p .zh{font-size:.9em}
.card .src{margin-top:.55rem;color:var(--grey);font-size:1rem;line-height:1.2;font-family:'Caveat',cursive;border-top:1px dashed var(--border);padding-top:.4rem}
.empty{color:var(--grey);font-style:italic;padding:1rem 0}

/* study buddy greets him at the door */
.wn-hi{display:flex;align-items:flex-start;gap:.7rem;margin:.7rem 0 1.2rem;max-width:44rem}
.wn-hi img{width:3.2rem;height:3.2rem;flex:0 0 auto}
.wn-hi .bubble{position:relative;background:#fff;border:1px solid var(--border2);border-radius:.9rem;padding:.6rem .9rem .5rem}
.wn-hi .bubble::before{content:"";position:absolute;left:-.4rem;top:1rem;width:.75rem;height:.75rem;background:#fff;border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);transform:rotate(45deg)}
.wn-hi .say{margin:0;font-size:.95rem;line-height:1.45}
.wn-hi .who{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--pencil)}

.foot{margin-top:2.2rem;color:var(--pencil);font-size:1.25rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== 4. Render ===== */
const $ = s => document.querySelector(s);
let filter = "all";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function cardHTML(l, i){
  const tilt = ((i % 3) - 1) * 0.6; // -0.6, 0, 0.6 deg
  const draw = THUMBS[l.thumb] || THUMBS.grid;
  return `<a class="card" href="${esc(l.href)}" style="--tilt:${tilt}deg" data-subject="${esc(l.subject)}">
    <div class="thumb">
      ${draw()}
      ${l.fixes ? `<span class="badge">${l.fixes} to fix</span>` : ""}
    </div>
    <h3>${esc(l.title)}<span class="zh">${esc(l.zh||"")}</span></h3>
    <p>${esc(l.desc||"")}<span class="zh">${esc(l.zhDesc||"")}</span></p>
    <div class="src">${esc(l.date)} · ${esc(l.source||"")}</div>
  </a>`;
}

function render(){
  const wrap = $("#subjects");
  const sorted = [...LESSONS].sort((a,b)=> b.date.localeCompare(a.date));
  const keys = Object.keys(SUBJECTS).filter(k => filter==="all" || k===filter);
  let html = "";
  keys.forEach(k=>{
    const list = sorted.filter(l=>l.subject===k);
    if(!list.length && filter==="all") return;         // hide empty subjects on "all"
    const s = SUBJECTS[k];
    html += `<section class="subject" data-subject="${k}">
      <div class="subject-head"><h2>${s.icon} ${s.en} <span class="zhi" style="font-size:.8em">${s.zh}</span></h2>
        <span class="count">${list.length} lesson${list.length===1?"":"s"}</span><span class="bar"></span></div>
      ${list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
                    : `<div class="empty">Nothing here yet · 還沒有這一科的筆記</div>`}
    </section>`;
  });
  wrap.innerHTML = html || `<div class="empty">No lessons yet.</div>`;
}

function renderFilters(){
  const used = new Set(LESSONS.map(l=>l.subject));
  const items = [["all","All","全部"], ...Object.entries(SUBJECTS).map(([k,v])=>[k,v.icon+" "+v.en,v.zh])];
  $("#filters").innerHTML = items.map(([k,en,zh])=>
    `<button type="button" class="chip${k===filter?" on":""}" data-k="${k}" ${k!=="all"&&!used.has(k)?'style="opacity:.55"':""}>${en}<span class="zh">${zh}</span></button>`).join("");
  $("#filters").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.k;renderFilters();render();}));
}

function stats(){
  $("#stLessons").textContent = LESSONS.length;
  $("#stSubjects").textContent = new Set(LESSONS.map(l=>l.subject)).size;
  $("#stFixes").textContent = LESSONS.reduce((n,l)=>n+(l.fixes||0),0);
}

/* ===== 5. Study buddy — one of the eight, picked fresh on every visit ===== */
const CREW = [["wolfchan","Wolf Chan"],["leebit","Leebit"],["dwaekki","Dwaekki"],["jiniret","Jiniret"],
              ["hanquokka","Han Quokka"],["bbokari","BbokAri"],["puppym","Puppy M"],["foxiny","FoxI.Ny"]];
function buddy(){
  const chosen = CREW[Math.floor(dayRandom()() * CREW.length)];   /* 今天的朋友,重整不換 */
  const img = $("#wnHiImg"), name = $("#wnHiName");
  if(!img || !name) return chosen;
  img.src = "img/skzoo-" + chosen[0] + ".png";
  img.alt = chosen[1] + ", your study buddy";
  name.textContent = chosen[1];
  return chosen;
}

/* ---------- school facts (真相源: TAAS 2026-2027 校曆.md) ----------
   資料事實零容錯: it must never ask about Band on a day school was closed. */
const TERM = ["2026-08-10", "2027-06-02"];
const NO_SCHOOL = ["2026-09-25","2026-09-28","2026-10-09","2026-10-26","2026-10-27",
  "2026-11-02","2026-11-26","2026-11-27","2027-01-04","2027-03-01","2027-03-29","2027-04-30"];
const NO_SCHOOL_RANGES = [["2026-12-21","2027-01-01"],["2027-02-04","2027-02-10"],["2027-04-05","2027-04-09"]];
const HALF_DAY = ["2026-11-25","2026-12-15","2026-12-18","2027-05-25","2027-06-01","2027-06-02"];
const SCHOOL_ON_HOLIDAY = ["2026-11-22","2027-03-07"];
/* 句庫〈MAP 前兩週〉的標題範圍含測驗期間,但四句全是「快到了」的語氣。
   測驗中不能說「快到了」——所以拆成 考前／考試中／考完 三段(真相源:TAAS 校曆的測驗日期)。 */
const MAP_PRE = [["2026-08-10","2026-08-23"],["2026-11-16","2026-11-29"],["2027-04-05","2027-04-18"]];
const MAP_NOW = [["2026-08-24","2026-09-04"],["2026-11-30","2026-12-04"],["2027-04-19","2027-04-23"]];
const MAP_POST = [["2026-09-05","2026-09-08"],["2026-12-05","2026-12-08"],["2027-04-24","2027-04-27"]];

/* Cecilia fills this in when there is one: {name:{en:"Sport Day",zh:"運動會"}, date:"2027-04-29"} */
const EVENTS = [];

const FOOD = [["potstickers","鍋貼"],["pork chop rice","排骨飯"],["braised pork rice","滷肉飯"],
  ["a scallion pancake","蔥抓餅"],["popcorn chicken","鹽酥雞"],["xiao long bao","小籠包"],
  ["a fried chicken cutlet","雞排"],["an oyster omelette","蚵仔煎"],["egg cakes","雞蛋糕"],
  ["a wheel cake","車輪餅"],["bubble tea","珍珠奶茶"],["pizza","pizza"],["a burger","漢堡"],
  ["fries","薯條"],["pasta","義大利麵"],["waffles","鬆餅"],["a croissant","可頌"],
  ["pudding","布丁"],["ice cream","冰淇淋"],["cake","蛋糕"]];

const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const within = (s, r) => s >= r[0] && s <= r[1];
/* 重整不該換小動物、也不該換句子(Cecilia 2026-08-31)。
   用「日期」當小動物的種子、「日期+小時」當句子的種子:同一小時內重整結果完全一樣,
   跨整點換句子、隔天換朋友。狀態不寫入瀏覽器永久儲存，符合〈四之二〉#5 的技術限制。 */
function seeded(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function dayRandom(d){ return seeded("buddy|" + iso(d || new Date())); }
const pick = (r, a) => a[Math.floor(r() * a.length)];

function offSchool(d){
  const s = iso(d), dow = d.getDay();
  if (s < TERM[0] || s > TERM[1]) return true;               // summer
  if (dow === 0 || dow === 6) return true;                   // weekend
  if (NO_SCHOOL.indexOf(s) >= 0) return true;
  return NO_SCHOOL_RANGES.some(r => within(s, r));
}

/* which pool the clock lands in. Friday goes home an hour earlier,
   so its golden hour starts at 15:00 (時段結構, 句庫). */
/* he leaves home at 7:15 and is back about 16:00 (15:00 on Friday, 13:00 on a half day) */
function poolFor(key){
  return key === "atschool" ? SAY.life.filter(l => !l.asksHisDay) : SAY[key];
}
/* 出門 7:15;到家 16:00(週五 15:00、半天 13:00,Cecilia 2026-08-31 確認)。
   「今天在學校怎麼樣」這種問句在他到家之前不成立——那一天還沒發生。 */
function homeHour(d, off){
  if (off) return 0;
  if (HALF_DAY.indexOf(iso(d)) >= 0) return 13;
  return d.getDay() === 5 ? 15 : 16;
}
function slot(d, off){
  const h = d.getHours(), fri = d.getDay() === 5;
  if (off) {
    if (h >= 22 || h < 6) return "hd2206";
    if (h < 12) return "hd0612";
    if (h < 18) return "hd1218";
    return "hd1822";
  }
  if (h >= 22 || h < 6) return "sd2206";
  const mins = h * 60 + d.getMinutes(), home = homeHour(d, off) * 60;
  if (mins < 7 * 60 + 15) return "sd0612";     // still at home, leaves at 7:15
  if (mins < home) return "atschool";          // in class / on the way: talk about ourselves
  if (mins < home + 30) return "sd1216";       // 剛回到筆記本 — he just walked in
  if (h < 18) return "sd1618";                 // 黃金時段
  return "sd1822";
}

/* 修飾層是覆蓋當格句子,不是另開時段 */
function layer(d, off){
  const s = iso(d), dow = d.getDay(), h = d.getHours();
  for (const e of EVENTS){
    const day = new Date(d); day.setDate(day.getDate() + 1);
    if (iso(day) === e.date && h >= 12) return {pool:"event", when:"eve", ev:e};
    if (s === e.date) return {pool:"event", when: h < 12 ? "morning" : "night", ev:e};
    const prev = new Date(d); prev.setDate(prev.getDate() - 1);
    if (iso(prev) === e.date) return {pool:"event", when:"after", ev:e};
  }
  if (SCHOOL_ON_HOLIDAY.indexOf(s) >= 0 && h >= 6 && h < 18) return {pool:"schoolonhol"};
  /* 半天(一年 6 天)比 MAP 視窗(一年 3 段)更specific,先講今天的事 */
  if (!off && HALF_DAY.indexOf(s) >= 0 && h >= 13 && h < 18) return {pool:"halfday"};
  if (MAP_POST.some(r => within(s, r)) && h >= 12 && h < 22) return {pool:"mappost"};
  if (MAP_NOW.some(r => within(s, r)) && h >= 12 && h < 22) return {pool:"mapnow", soft:1};
  if (MAP_PRE.some(r => within(s, r)) && h >= 12 && h < 22) return {pool:"mappre"};
  if (off) return null;
  const mins = h * 60 + d.getMinutes(), home = homeHour(d, off) * 60;
  if (mins < home) return null;                /* those layers talk about a school day he has not finished yet */
  /* 每週都會來的層是調味,不整段取代當格——否則一週四天抽不到黃金時段那 14 句邀請 */
  if (dow === 5 && h < 22) return {pool:"friday", soft:1};
  if ((dow === 1 || dow === 3) && h < 18) return {pool:"monwed", soft:1};
  if ((dow === 2 || dow === 4) && h < 18) return {pool:"tuethu", soft:1};
  return null;
}

/* 一半帶門、一半純陪伴: the free questions and its own life are the companionship half */
function companionPool(d, off){
  const dow = d.getDay(), h = d.getHours(), night = (h >= 18 || h < 6);
  const okSubj = tag => {
    if (off) return false;
    if (tag === "monwed") return dow === 1 || dow === 3;
    if (tag === "tuethu") return dow === 2 || dow === 4;
    if (tag === "fri")    return dow === 5;
    if (tag === "pe")     return dow === 1 || dow === 3 || dow === 5;
    return true;
  };
  const backHome = off || (h >= homeHour(d, off) && h < 22);
  return SAY.free.concat(SAY.life).filter(l => {
    /* before he walks back in, nothing about "today at school" has happened yet */
    if ((l.asksHisDay || l.subj) && !backHome) return false;
    if (l.night && !night) return false;
    if (l.subj) return okSubj(l.subj);
    if (l.pool === "free" && off) return true;
    return true;
  });
}

function fill(line, speaker, ev, r){
  const crewLeft = CREW.filter(c => c[1] !== speaker[1]).slice();
  const foodLeft = FOOD.slice();
  const takeCrew = () => {                 /* 同一句出現兩次要抽不同隻,且不同於講話者 */
    if (!crewLeft.length) return pick(r, CREW);
    return crewLeft.splice(Math.floor(r() * crewLeft.length), 1)[0];
  };
  const takeFood = () => {
    if (!foodLeft.length) return pick(r, FOOD);
    return foodLeft.splice(Math.floor(r() * foodLeft.length), 1)[0];
  };
  let en = line.en, zh = line.zh;
  while (en.indexOf("{SKZOO}") >= 0 || zh.indexOf("{SKZOO}") >= 0){
    const c = takeCrew();
    en = en.replace("{SKZOO}", c[1]);
    zh = zh.replace("{SKZOO}", c[1]);
  }
  while (en.indexOf("{FOOD}") >= 0 || zh.indexOf("{FOOD}") >= 0){
    const f = takeFood();
    const at = en.indexOf("{FOOD}");
    const bare = /some $|any $/i.test(en.slice(0, at));   /* "I hid some {FOOD}" */
    en = en.replace("{FOOD}", bare ? f[0].replace(/^(a|an) /i, "") : f[0]);
    zh = zh.replace("{FOOD}", f[1]);
  }
  if (ev){
    en = en.split("{活動}").join(ev.name.en);
    zh = zh.split("{活動}").join(ev.name.zh);
  }
  return [en, zh];
}

function say(speaker){
  const el = $("#wnHiLine");
  if (!el || !speaker) return;
  const now = new Date();
  const r = seeded("say|" + iso(now) + "|" + now.getHours());
  const off = offSchool(now);
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowOff = offSchool(tomorrow);

  const lay = layer(now, off);
  let primary = lay ? SAY[lay.pool].slice() : poolFor(slot(now, off)).slice();
  if (lay && lay.pool === "event") primary = primary.filter(l => l.when === lay.when);
  primary = primary.filter(l => l.cond !== "tomorrowOff" || tomorrowOff);
  if (!primary.length) primary = poolFor(slot(now, off)).filter(l => l.cond !== "tomorrowOff" || tomorrowOff);

  const companions = companionPool(now, off);
  const slotPool = poolFor(slot(now, off)).filter(l => l.cond !== "tomorrowOff" || tomorrowOff);
  /* 一半帶門、一半純陪伴;鮮少發生的層(半天/假日到校/MAP)整段覆蓋,每週層只佔一份 */
  let usable;
  const roll = r();
  if (lay && lay.soft) usable = roll < 0.35 ? primary : (roll < 0.65 ? slotPool : companions);
  else                 usable = roll < 0.60 ? primary : companions;
  if (!usable || !usable.length) usable = primary.length ? primary : slotPool;
  const line = pick(r, usable);
  if (!line) return;

  const said = fill(line, speaker, lay && lay.ev, r);
  const lead = said[0].match(/^(.{1,34}?[!?])\s/);
  const leadZh = said[1].match(/^(.{1,18}?[！？])/);
  const en = lead ? "<b>" + lead[1] + "</b>" + said[0].slice(lead[1].length) : said[0];
  const zh = leadZh ? "<b>" + leadZh[1] + "</b>" + said[1].slice(leadZh[1].length) : said[1];
  el.innerHTML = en + '<span class="zh">' + zh + "</span>";
}

renderFilters(); render(); stats(); say(buddy());
</script>
