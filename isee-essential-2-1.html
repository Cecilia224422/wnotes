 const open=async raw=>{const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},k,b(D.ct)))};

 const loaded=new Promise(r=>{if(document.readyState==='complete')r();else addEventListener('load',()=>r(),{once:true})});
