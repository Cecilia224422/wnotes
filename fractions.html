 const loaded=new Promise(r=>{if(document.readyState==='complete')r();else addEventListener('load',()=>r(),{once:true})});
 const jump=()=>{if(location.hash.length<2)return;try{const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView()}catch(_){}};
 const show=async html=>{await loaded;document.open();document.write(html);document.close();jump();addEventListener('load',jump,{once:true})};
 if(!(window.crypto&&crypto.subtle)){$('gate').hidden=false;$('msg').textContent='This page needs a secure (https) address to open.';$('go').disabled=true;return}
 /* a key remembered from an earlier page opens this one without asking */
 for(const st of stores){let v=null;try{v=st.getItem(K)}catch(_){}
  if(v){let html=null;try{html=await open(b(v))}catch(_){try{st.removeItem(K)}catch(_){}}
   if(html!==null){await show(html);return}}}
 $('gate').hidden=false;$('pw').focus();
 $('see').addEventListener('change',e=>{$('pw').type=e.target.checked?'text':'password'});
 $('f').addEventListener('submit',async e=>{e.preventDefault();const pw=$('pw').value.trim().normalize('NFKC');if(!pw)return;
  $('go').disabled=true;$('msg').textContent='';
  try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
   const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(D.s),iterations:D.i},base,256));
   const html=await open(raw),v=btoa(String.fromCharCode(...raw));
   stores.forEach((st,i)=>{if(i===0||$('keep').checked){try{st.setItem(K,v)}catch(_){}}});
   await show(html)}
  catch(_){$('msg').textContent='That is not the password. Try again. · 密碼不對，再試一次。';$('go').disabled=false;$('pw').select()}});
})();
</script>
</body>
</html>
